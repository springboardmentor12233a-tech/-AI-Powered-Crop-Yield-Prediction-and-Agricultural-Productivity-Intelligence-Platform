version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: yieldsense_db_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: yieldsense_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
