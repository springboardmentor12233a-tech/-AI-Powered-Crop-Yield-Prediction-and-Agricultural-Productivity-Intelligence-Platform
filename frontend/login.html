<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YieldSense AI — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #F5F2E8;
            --panel: #FFFDF7;
            --green: #1F3D2B;
            --green-dark: #16301F;
            --gold: #C89B3C;
            --gold-soft: #F1E4C3;
            --soil: #5B3A29;
            --ink: #22271F;
            --line: #DDD5C2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family: 'IBM Plex Sans', sans-serif;
            color: var(--ink);
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 36px 32px;
            box-shadow: 0 2px 18px rgba(31, 61, 43, 0.06);
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand h1 {
            font-family: 'Fraunces', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--green-dark);
            margin: 0 0 4px;
        }

        .brand p {
            font-size: 12.5px;
            color: #6B7268;
            margin: 0;
        }

        .tabs {
            display: flex;
            border: 1px solid var(--line);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 22px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            background: #FBF8EF;
            color: var(--soil);
        }

        .tab.active {
            background: var(--green);
            color: #FBF8EF;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .field label {
            font-size: 13px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 14px;
            padding: 10px 12px;
            border: 1px solid #C9C1AA;
            border-radius: 3px;
            background: #FFFEFB;
        }

        input:focus {
            outline: 2px solid var(--gold);
            outline-offset: 1px;
            border-color: var(--gold);
        }

        .role-row {
            display: flex;
            gap: 10px;
        }

        .role-option {
            flex: 1;
            text-align: center;
            padding: 10px;
            border: 1px solid #C9C1AA;
            border-radius: 3px;
            font-size: 13.5px;
            cursor: pointer;
            background: #FFFEFB;
        }

        .role-option.selected {
            background: var(--gold-soft);
            border-color: var(--gold);
            font-weight: 600;
        }

        button.submit {
            width: 100%;
            background: var(--green);
            color: #FBF8EF;
            border: none;
            padding: 13px 20px;
            font-size: 14.5px;
            font-weight: 600;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 4px;
        }

        button.submit:hover {
            background: var(--green-dark);
        }

        button.submit:disabled {
            background: #9AA79E;
            cursor: wait;
        }

        .msg {
            font-size: 13px;
            padding: 10px 12px;
            border-radius: 3px;
            margin-bottom: 16px;
            display: none;
        }

        .msg.error {
            background: #F6DEDA;
            color: #7A2E1E;
            display: block;
        }

        .msg.success {
            background: #D7E8DC;
            color: #1F5233;
            display: block;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="brand">
            <h1>YieldSense AI</h1>
            <p>Crop Yield Prediction &amp; Agricultural Productivity Forecasting</p>
        </div>

        <div class="tabs">
            <div class="tab active" id="loginTab" onclick="switchTab('login')">Sign In</div>
            <div class="tab" id="registerTab" onclick="switchTab('register')">Register</div>
        </div>

        <div id="msgBox" class="msg"></div>

        <!-- LOGIN FORM -->
        <div id="loginForm">
            <div class="field">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your username">
            </div>
            <div class="field">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>
            <button class="submit" id="loginBtn" onclick="doLogin()">Sign In</button>
        </div>

        <!-- REGISTER FORM -->
        <div id="registerForm" class="hidden">
            <div class="field">
                <label for="regUsername">Username</label>
                <input type="text" id="regUsername" placeholder="Choose a username">
            </div>
            <div class="field">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" placeholder="Choose a password">
            </div>
            <div class="field">
                <label>I am a</label>
                <div class="role-row">
                    <div class="role-option selected" id="roleFarmer" onclick="selectRole('farmer')">Farmer</div>
                    <div class="role-option" id="roleAdmin" onclick="selectRole('admin')">Admin</div>
                </div>
            </div>
            <button class="submit" id="registerBtn" onclick="doRegister()">Create Account</button>
        </div>
    </div>

    <script>
        const API = "";
        let selectedRole = "farmer";

        function switchTab(tab) {
            document.getElementById('loginTab').classList.toggle('active', tab === 'login');
            document.getElementById('registerTab').classList.toggle('active', tab === 'register');
            document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
            document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
            hideMsg();
        }

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('roleFarmer').classList.toggle('selected', role === 'farmer');
            document.getElementById('roleAdmin').classList.toggle('selected', role === 'admin');
        }

        function showMsg(text, type) {
            const box = document.getElementById('msgBox');
            box.textContent = text;
            box.className = 'msg ' + type;
        }
        function hideMsg() {
            const box = document.getElementById('msgBox');
            box.className = 'msg';
        }

        async function doLogin() {
            const btn = document.getElementById('loginBtn');
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showMsg('Please enter both username and password.', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Signing in...';

            try {
                const res = await fetch(`${API}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    showMsg(data.error || 'Login failed.', 'error');
                    return;
                }

                if (data.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }
            } catch (err) {
                showMsg('Unable to reach the backend. Is Flask running?', 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Sign In';
            }
        }

        async function doRegister() {
            const btn = document.getElementById('registerBtn');
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;

            if (!username || !password) {
                showMsg('Please enter both username and password.', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Creating account...';

            try {
                const res = await fetch(`${API}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password, role: selectedRole })
                });
                const data = await res.json();

                if (!res.ok) {
                    showMsg(data.error || 'Registration failed.', 'error');
                    return;
                }

                showMsg('Account created! You can now sign in.', 'success');
                switchTab('login');
                document.getElementById('loginUsername').value = username;
            } catch (err) {
                showMsg('Unable to reach the backend. Is Flask running?', 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Create Account';
            }
        }
    </script>

</body>

</html>
